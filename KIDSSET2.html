                <div id="question">Question text loads here...</div>

            <div class="btn-grid" id="answer-buttons"></div>
            
            <div class="action-row">
                <button id="prev-btn" class="nav-btn" style="display: none;" onclick="prevQuestion()">⬅️ Previous</button>

<script>
    let currentLang = 'EN';

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'TA' : 'EN';
        showQuestion();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function speakQuestion() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let qData = questions[currentQuestionIndex];
            let textToSpeak = currentLang === 'EN' ? qData.q_en : qData.q_ta;
            let speech = new SpeechSynthesisUtterance(textToSpeak);
            speech.lang = currentLang === 'EN' ? 'en-US' : 'ta-IN';
            speech.rate = 0.85;
            window.speechSynthesis.speak(speech);
        }
    }

    // New Set 2 Kids Questions
    const questions = [
        {
            q_en: "1. Which animal has a very long neck? 🦒🌿",

            ans_ta: [{ t: "அ) வரிக்குதிரை 🦓", c: false }, { t: "ஆ) ஒட்டகச்சிவிங்கி 🦒", c: true }, { t: "இ) கங்காரு 🦘", c: false }, { t: "ஈ) குதிரை 🐎", c: false }]
        },
        {

            ans_en: [{ t: "A) Brain 🧠", c: false }, { t: "B) Lungs 🫁", c: false }, { t: "C) Heart 🫀", c: true }, { t: "D) Kidney 🫘", c: false }],
            ans_ta: [{ t: "அ) மூளை 🧠", c: false }, { t: "ஆ) நுரையீரல் 🫁", c: false }, { t: "இ) இதயம் 🫀", c: true }, { t: "ஈ) சிறுநீரகம் 🫘", c: false }]
        },
        {
            q_en: "3. What color do you get when you mix blue and yellow? 🎨🟢",
            q_ta: "3. நீலமும் மஞ்சளும் கலந்தால் என்ன நிறம் கிடைக்கும்? 🎨🟢",
            ans_en: [{ t: "A) Red 🔴", c: false }, { t: "B) Green 🟢", c: true }, { t: "C) Orange 🟠", c: false }, { t: "D) Purple 🟣", c: false }],
            ans_ta: [{ t: "அ) சிவப்பு 🔴", c: false }, { t: "ஆ) பச்சை 🟢", c: true }, { t: "இ) ஆரஞ்சு 🟠", c: false }, { t: "ஈ) ஊதா 🟣", c: false }]

            ans_ta: [{ t: "அ) தீக்கோழி (Ostrich) 🦤", c: true }, { t: "ஆ) கழுகு 🦅", c: false }, { t: "இ) கோழி 🐔", c: false }, { t: "ஈ) வாத்து 🦆", c: false }]

            q_ta: "15. இந்தியாவின் தேசியப் பறவை எது? 🇮🇳🦚",
            ans_en: [{ t: "A) Parrot 🦜", c: false }, { t: "B) Peacock 🦚", c: true }, { t: "C) Pigeon 🕊️", c: false }, { t: "D) Crow 🐦‍⬛", c: false }],
            ans_ta: [{ t: "அ) கிளி 🦜", c: false }, { t: "ஆ) மயில் 🦚", c: true }, { t: "இ) புறா 🕊️", c: false }, { t: "ஈ) காக்கா 🐦‍⬛", c: false }]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = {};

    const questionElement = document.getElementById("question");
    const answerButtonsElement = document.getElementById("answer-buttons");
    const nextButton = document.getElementById("next-btn");
    const prevButton = document.getElementById("prev-btn");
    const quizBox = document.getElementById("quiz-box");
    const resultBox = document.getElementById("result-box");
    const scoreText = document.getElementById("score-text");
    const progressText = document.getElementById("progress-text");
    const feedbackMsg = document.getElementById("feedback-msg");
    const feedbackAnim = document.getElementById("feedback-anim");

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = {};
        quizBox.style.display = "block";
        resultBox.style.display = "none";
        showQuestion();
    }

    function showQuestion() {
        resetState();
        let qData = questions[currentQuestionIndex];
        progressText.innerText = currentLang === 'EN' ? `Question ${currentQuestionIndex + 1} of 15` : `வினா ${currentQuestionIndex + 1} / 15`;
        questionElement.innerText = currentLang === 'EN' ? qData.q_en : qData.q_ta;
        feedbackAnim.innerText = "💡";

        if (currentQuestionIndex > 0) {
            prevButton.style.display = "block";
        } else {
            prevButton.style.display = "none";
        }

        let answers = currentLang === 'EN' ? qData.ans_en : qData.ans_ta;

        answers.forEach((answer, index) => {
            const button = document.createElement("button");
            button.innerText = answer.t;
            button.classList.add("btn");
            if (answer.c) {
                button.dataset.correct = answer.c;
            }

            if (userAnswers[currentQuestionIndex] !== undefined) {
                button.disabled = true;
                if (index === userAnswers[currentQuestionIndex].selectedIndex) {
                    if (userAnswers[currentQuestionIndex].isCorrect) {
                        button.classList.add("correct");
                    } else {
                        button.classList.add("wrong");
                    }
                }
                if (answer.c) {
                    button.classList.add("correct");
                }
            } else {
                button.addEventListener("click", (e) => selectAnswer(e, index));
            }

            answerButtonsElement.appendChild(button);
        });

        if (userAnswers[currentQuestionIndex] !== undefined) {
            answered = true;
            if (currentQuestionIndex < questions.length - 1) {
                nextButton.style.display = "block";
            }
        }
    }

    function resetState() {
        answered = false;
        nextButton.style.display = "none";
        while (answerButtonsElement.firstChild) {
            answerButtonsElement.removeChild(answerButtonsElement.firstChild);
        }
    }

    function selectAnswer(e, index) {
        if (answered && userAnswers[currentQuestionIndex] !== undefined) return;
        answered = true;
        
        window.speechSynthesis.cancel();
        playSound('click');
        const selectedButton = e.target;
        const isCorrect = selectedButton.dataset.correct === "true";

        userAnswers[currentQuestionIndex] = { selectedIndex: index, isCorrect: isCorrect };

        if (isCorrect) {
            selectedButton.classList.add("correct");
            score++;
            playSound('correct');
            feedbackAnim.innerText = "🎆 👏 🥳 🎉 🔥 (Super!)";
        } else {
            selectedButton.classList.add("wrong");
            playSound('wrong');
            feedbackAnim.innerText = "😢 ❌ (Oh no! Try next)";
        }

        Array.from(answerButtonsElement.children).forEach(button => {
            if (button.dataset.correct === "true") {
                button.classList.add("correct");
            }
            button.disabled = true;
        });

        if (currentQuestionIndex < questions.length - 1) {
            nextButton.style.display = "block";
        } else {
            setTimeout(showScore, 1000);
        }
    }

    function showScore() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        scoreText.innerText = currentLang === 'EN' ? `You scored ${score} of 15! 🌟` : `நீங்கள் பெற்ற மதிப்பெண் ${score} / 15! 🌟`;
        
        if (score === questions.length) {
            feedbackMsg.innerText = currentLang === 'EN' ? "🏆 Incredible! Perfect score! You are a Genius! 🚀" : "🏆 அசத்திட்டீங்க சாம்பியன்! உங்களுக்கு முழு மதிப்பெண்! நீங்கள் ஒரு ஜீனியஸ்! 🚀🎆";
        } else if (score >= 10) {
            feedbackMsg.innerText = currentLang === 'EN' ? "🌟 Great job! You know amazing facts! Keep it up! 👍" : "🌟 அருமையான முயற்சி! நிறைய விஷயங்கள் தெரிந்து வைத்துள்ளீர்கள்! தொடர்ந்து சாதிக்க வாழ்த்துகள்! 👍✨";
        } else {
            feedbackMsg.innerText = currentLang === 'EN' ? "💡 Good try! Play again to make your score even better! 💪" : "💡 நல்ல முயற்சி குட்டி! இன்னும் கொஞ்சம் நன்றாக முயன்றால் இன்னும் அதிக மதிப்பெண் பெறலாம்! மீண்டும் விளையாடுங்கள்! 💪🎯";
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            showQuestion();
        }
    }

    function restartQuiz() {
        startQuiz();
    }

    startQuiz();
</script>

</body>
</html>
