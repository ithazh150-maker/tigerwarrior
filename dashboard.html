<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Buttons Dashboard</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 26px;
      text-align: center;
      color: #4ade80;
    }
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 380px;
    }
    .glow-btn {
      display: block;
      text-align: center;
      padding: 18px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 20px #22c55e;
      animation: neonPulse 1.5s infinite ease-in-out;
      transition: transform 0.2s;
    }
    .glow-btn:hover {
      transform: scale(1.05);
    }
    @keyframes neonPulse {
      0% {
        box-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e;
      }
      50% {
        box-shadow: 0 0 30px #4ade80, 0 0 60px #22c55e;
      }
      100% {
        box-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e;
      }
    }
  </style>
</head>
<body>
  <h1>Select a Link Below</h1>
  <div class="button-container">
    <a href="https://ithazh150-maker.github.io/tigerwarrior/freetest.html" class="glow-btn" target="_blank">Touch Here 1</a>
    <a href="https://ithazh150-maker.github.io/tigerwarrior/freetest.html" class="glow-btn" target="_blank">Touch Here 2</a>
    <a href="https://ithazh150-maker.github.io/tigerwarrior/freetest.html" class="glow-btn" target="_blank">Touch Here 3</a>
    <a href="https://ithazh150-maker.github.io/tigerwarrior/freetest.html" class="glow-btn" target="_blank">Touch Here 4</a>
    <a href="https://ithazh150-maker.github.io/tigerwarrior/freetest.html" class="glow-btn" target="_blank">Touch Here 5</a>
  </div>
</body>
</html>
